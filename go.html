<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Weiter zum Shop</title>
<style>
  :root { --bg: #EEF1F5; --ink: #1A2230; }
  @media (prefers-color-scheme: dark) { :root { --bg: #121721; --ink: #E7ECF3; } }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; }
  main { text-align: center; padding: 16px; }
  button { font: 600 16px system-ui; padding: 12px 20px; border-radius: 999px; border: 0; background: var(--ink); color: var(--bg); cursor: pointer; }
</style>
</head>
<body>
<main>
  <p>Weiter zum Shop …</p>
  <!-- billiger.de leitet nur per Formular zum Händler weiter; diese Seite schickt das Formular automatisch ab -->
  <form id="f" method="POST" action="https://www.billiger.de/redirect">
    <input type="hidden" name="target" id="t">
    <input type="hidden" name="searchStatisticsData" value="">
    <button type="submit">Zum Shop</button>
  </form>
</main>
<script>
  const b = new URLSearchParams(location.search).get('b') || '';
  if (/^[A-Za-z0-9_-]{20,2000}$/.test(b)) { document.getElementById('t').value = b; document.getElementById('f').submit(); }
  else document.querySelector('p').textContent = 'Dieser Link ist ungültig.';
</script>
</body>
</html>
